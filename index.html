<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembaca Materi Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18191a;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #242526;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #3a3b3c;
      gap: 10px;
    }
    label {
      font-size: 14px;
      color: #b0b3b8;
      font-weight: 600;
      white-space: nowrap;
    }
    select {
      background: #3a3b3c;
      color: #ffffff;
      border: 1px solid #4e4f50;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 100%;
      max-width: 320px;
    }
    #viewer-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #2b2b2b;
    }
  </style>
</head>
<body>

  <header>
    <label for="book-select">Pilih Materi:</label>
    <select id="book-select">
      <option value="wawasan-kebangsaan-dakwah-islam.pdf">1. Wawasan Kebangsaan</option>
      <option value="retorika.pdf">2. Retorika</option>
      <option value="tata-cara-khutbah.pdf">3. Tata Cara Khutbah</option>
    </select>
  </header>

  <iframe id="viewer-frame" src="wawasan-kebangsaan-dakwah-islam.pdf"></iframe>

  <script>
    const select = document.getElementById('book-select');
    const frame = document.getElementById('viewer-frame');

    select.addEventListener('change', (e) => {
      frame.src = e.target.value;
    });
  </script>
</body>
</html>
