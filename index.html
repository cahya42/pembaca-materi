<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pembaca Materi Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e24;
      color: #f1f2f6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #2f3542;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #404b5a;
      z-index: 10;
      gap: 10px;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 600;
      color: #a4b0be;
      white-space: nowrap;
    }
    select {
      background: #1e1e24;
      color: #ffffff;
      border: 1px solid #57606f;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      max-width: 65%;
      text-overflow: ellipsis;
    }
    #book-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #131417;
      overflow: hidden;
      padding: 8px;
    }
    #flipbook {
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .page {
      background-color: #ffffff;
      position: relative;
      overflow: hidden;
    }
    .page canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .page-loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      color: #888;
    }
    #loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 20px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      z-index: 20;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #3742fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer {
      background: #2f3542;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #404b5a;
      z-index: 10;
    }
    button.nav-btn {
      background: #3742fa;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button.nav-btn:disabled {
      background: #57606f;
      opacity: 0.5;
      cursor: not-allowed;
    }
    #page-info {
      font-size: 13px;
      color: #ced6e0;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
</head>
<body>

  <header>
    <span class="brand-title">Materi:</span>
    <select id="book-select">
      <option value="wawasan-kebangsaan-dakwah-islam.pdf">1. Wawasan Kebangsaan Dakwah Islam</option>
      <option value="retorika.pdf">2. Retorika</option>
      <option value="tata-cara-khutbah.pdf">3. Tata Cara Khutbah</option>
    </select>
  </header>

  <div id="book-container">
    <div id="loading-indicator">
      <div class="spinner"></div>
      <span id="loading-text">Mempersiapkan buku...</span>
    </div>
    <div id="flipbook"></div>
  </div>

  <footer>
    <button id="btn-prev" class="nav-btn" disabled>‹ Sebelumnya</button>
    <span id="page-info">- / -</span>
    <button id="btn-next" class="nav-btn" disabled>Selanjutnya ›</button>
  </footer>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let pageFlipInstance = null;
    const renderedPages = new Set();
    const loadingElem = document.getElementById('loading-indicator');
    const loadingText = document.getElementById('loading-text');
    const bookContainer = document.getElementById('book-container');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const pageInfo = document.getElementById('page-info');

    async function renderSinglePage(num) {
      if (renderedPages.has(num) || !pdfDoc || num < 1 || num > pdfDoc.numPages) return;
      renderedPages.add(num);

      const pageDiv = document.getElementById(`page-wrapper-${num}`);
      if (!pageDiv) return;

      const page = await pdfDoc.getPage(num);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      // Skala 1.5 cukup tajam di layar ponsel tanpa menghabiskan RAM
      const viewport = page.getViewport({ scale: 1.5 });
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      pageDiv.innerHTML = '';
      pageDiv.appendChild(canvas);
    }

    async function loadBook(pdfUrl) {
      loadingElem.style.display = 'flex';
      loadingText.textContent = 'Membuka dokumen...';
      renderedPages.clear();

      if (pageFlipInstance) {
        pageFlipInstance.destroy();
        pageFlipInstance = null;
      }

      const flipbookEl = document.getElementById('flipbook');
      flipbookEl.innerHTML = '';

      try {
        pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
        const numPages = pdfDoc.numPages;

        const firstPage = await pdfDoc.getPage(1);
        const viewport = firstPage.getViewport({ scale: 1.0 });

        // Buat kerangka halaman kosong terlebih dahulu
        for (let i = 1; i <= numPages; i++) {
          const div = document.createElement('div');
          div.className = 'page';
          div.id = `page-wrapper-${i}`;
          div.innerHTML = `<span class="page-loader">Memuat...</span>`;
          flipbookEl.appendChild(div);
        }

        // Hitung dimensi layar HP
        const isMobile = window.innerWidth <= 768;
        const containerWidth = bookContainer.clientWidth - 16;
        const containerHeight = bookContainer.clientHeight - 16;

        let displayWidth = isMobile ? containerWidth : Math.min(containerWidth / 2, 480);
        let displayHeight = (displayWidth * viewport.height) / viewport.width;

        if (displayHeight > containerHeight) {
          displayHeight = containerHeight;
          displayWidth = (displayHeight * viewport.width) / viewport.height;
        }

        // Render langsung halaman awal agar buku lekas tampil
        await renderSinglePage(1);
        if (!isMobile) await renderSinglePage(2);

        pageFlipInstance = new St.PageFlip(flipbookEl, {
          width: displayWidth,
          height: displayHeight,
          size: "fixed",
          showCover: false,
          usePortrait: isMobile,
          mobileScrollSupport: false,
          flippingTime: 500
        });

        pageFlipInstance.loadFromHTML(document.querySelectorAll('.page'));

        // Muat halaman berikutnya secara otomatis di latar belakang saat lembaran dibalik
        pageFlipInstance.on('flip', (e) => {
          const curr = e.data + 1;
          pageInfo.textContent = `${curr} / ${numPages}`;
          btnPrev.disabled = e.data === 0;
          btnNext.disabled = curr >= numPages;

          renderSinglePage(curr);
          renderSinglePage(curr + 1);
          renderSinglePage(curr + 2);
        });

        pageInfo.textContent = `1 / ${numPages}`;
        btnPrev.disabled = true;
        btnNext.disabled = numPages <= 1;
        loadingElem.style.display = 'none';

        // Lanjutkan merender halaman 2 dan 3 di latar belakang
        renderSinglePage(2);
        renderSinglePage(3);

      } catch (err) {
        console.error(err);
        loadingText.textContent = 'Gagal memuat: ' + err.message;
      }
    }

    btnPrev.addEventListener('click', () => pageFlipInstance && pageFlipInstance.flipPrev());
    btnNext.addEventListener('click', () => pageFlipInstance && pageFlipInstance.flipNext());
    document.getElementById('book-select').addEventListener('change', (e) => loadBook(e.target.value));

    // Jalankan pertama kali
    loadBook(document.getElementById('book-select').value);
  </script>
</body>
</html>
