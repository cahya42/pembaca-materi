<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembaca Materi Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    header { background: #2c2c2c; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3d3d3d; }
    select { background: #3d3d3d; color: white; border: 1px solid #555; padding: 6px 12px; border-radius: 6px; font-size: 14px; outline: none; }
    #viewer-container { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; background: #333; }
    canvas { max-width: 95%; max-height: 90vh; box-shadow: 0 4px 20px rgba(0,0,0,0.6); border-radius: 4px; transition: transform 0.2s ease; }
    .page-turn { transform: rotateY(-15deg); }
    footer { background: #2c2c2c; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #3d3d3d; }
    button { background: #007aff; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <header>
    <label for="book-select">Pilih Materi:</label>
    <select id="book-select">
      <option value="wawasan-kebangsaan-dakwah-islam.pdf">Modul 1: Wawasan Kebangsaan & Dakwah Islam</option>
      <option value="retorika.pdf">Modul 2: Retorika</option>
      <option value="tata-cara-khutbah.pdf">Modul 3: Tata Cara Khutbah</option>
    </select>
  </header>

  <div id="viewer-container">
    <canvas id="pdf-render"></canvas>
  </div>

  <footer>
    <button id="prev-page">‹ Sebelumnya</button>
    <span id="page-num">Halaman: 1 / -</span>
    <button id="next-page">Selanjutnya ›</button>
  </footer>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let pageNum = 1;
    const canvas = document.getElementById('pdf-render');
    const ctx = canvas.getContext('2d');

    function renderPage(num) {
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale: 1.5 });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = { canvasContext: ctx, viewport: viewport };
        page.render(renderContext).promise.then(() => {
          document.getElementById('page-num').textContent = `Halaman: ${num} / ${pdfDoc.numPages}`;
          document.getElementById('prev-page').disabled = num <= 1;
          document.getElementById('next-page').disabled = num >= pdfDoc.numPages;
        });
      });
    }

    function loadPDF(url) {
      pdfjsLib.getDocument(url).promise.then(pdf => {
        pdfDoc = pdf;
        pageNum = 1;
        renderPage(pageNum);
      });
    }

    // Navigasi Halaman dengan Efek Sederhana
    document.getElementById('prev-page').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      renderPage(pageNum);
    });

    document.getElementById('next-page').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      canvas.classList.add('page-turn');
      setTimeout(() => {
        pageNum++;
        renderPage(pageNum);
        canvas.classList.remove('page-turn');
      }, 150);
    });

    // Pilihan Menu Materi
    document.getElementById('book-select').addEventListener('change', (e) => {
      loadPDF(e.target.value);
    });

    // Muat materi pertama saat dibuka
    loadPDF(document.getElementById('book-select').value);
  </script>
</body>
</html>
