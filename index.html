<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pembaca Materi Digital</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">

  <!-- CSS PDF.js Viewer untuk Lapisan Anotasi / Tautan Daftar Isi -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Header Mengambang (Disembunyikan, Muncul Saat Double Tap) */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      gap: 8px;
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform: translateY(-100%);
    }
    header.show {
      transform: translateY(0);
    }

    .controls-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      overflow: hidden;
    }
    select {
      background: #2c2c2c;
      color: white;
      border: 1px solid #444;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      flex: 1;
      max-width: 220px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-upload {
      background: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    #file-input { display: none; }

    /* Area Viewer */
    #viewer-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      background: #121212;
      padding: 4px;
    }

    /* Penampung Kanvas + Anotasi Link Daftar Isi */
    #page-wrapper {
      position: relative;
      display: inline-block;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      border-radius: 4px;
      background: #ffffff;
      transition: transform 0.15s ease-out, opacity 0.15s ease-out;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
    }

    /* Lapisan Tautan Klik Daftar Isi */
    .annotationLayer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: auto;
    }
    .annotationLayer section {
      position: absolute;
      text-align: initial;
    }
    .annotationLayer .linkAnnotation > a {
      position: absolute;
      font-size: 1em;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* Animasi Buka Lembaran */
    .swipe-next {
      animation: animSwipeNext 0.22s ease-out;
    }
    .swipe-prev {
      animation: animSwipePrev 0.22s ease-out;
    }
    @keyframes animSwipeNext {
      0% { transform: translateX(40px) scale(0.96); opacity: 0.5; }
      100% { transform: translateX(0) scale(1); opacity: 1; }
    }
    @keyframes animSwipePrev {
      0% { transform: translateX(-40px) scale(0.96); opacity: 0.5; }
      100% { transform: translateX(0) scale(1); opacity: 1; }
    }

    /* Nomor Halaman di Bawah */
    #floating-page-info {
      position: absolute;
      bottom: 12px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      color: #ddd;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
      z-index: 50;
    }

    #loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      z-index: 60;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- Menu Pilihan Dokumen -->
  <header id="main-header">
    <div class="controls-left">
      <select id="book-select">
        <option value="wawasan-kebangsaan-dakwah-islam.pdf">1. Wawasan Kebangsaan</option>
        <option value="retorika.pdf">2. Retorika</option>
        <option value="tata-cara-khutbah.pdf">3. Tata Cara Khutbah</option>
      </select>
      <label for="file-input" class="btn-upload">📁 Pilih File</label>
      <input type="file" id="file-input" accept="application/pdf">
    </div>
  </header>

  <!-- Area Kanvas Materi & Tautan Daftar Isi -->
  <div id="viewer-container">
    <div id="loading-indicator">Memuat halaman...</div>
    <div id="page-wrapper">
      <canvas id="pdf-render"></canvas>
      <div id="annotation-layer" class="annotationLayer"></div>
    </div>
    <div id="floating-page-info">- / -</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
      });
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;

    const canvas = document.getElementById('pdf-render');
    const ctx = canvas.getContext('2d');
    const pageWrapper = document.getElementById('page-wrapper');
    const annotationContainer = document.getElementById('annotation-layer');
    const container = document.getElementById('viewer-container');
    const loading = document.getElementById('loading-indicator');
    const pageFloatingText = document.getElementById('floating-page-info');
    const mainHeader = document.getElementById('main-header');

    // Link Service untuk menangani klik Daftar Isi
    const linkService = {
      getDestinationHash: () => '#',
      getAnchorUrl: () => '#',
      setHash: () => {},
      executeNamedAction: () => {},
      goToDestination: async (dest) => {
        if (!pdfDoc) return;
        try {
          let explicitDest = dest;
          if (typeof dest === 'string') {
            explicitDest = await pdfDoc.getDestination(dest);
          }
          if (Array.isArray(explicitDest)) {
            const pageIndex = await pdfDoc.getPageIndex(explicitDest[0]);
            pageNum = pageIndex + 1;
            queueRenderPage(pageNum, 'swipe-next');
          }
        } catch (err) {
          console.error("Gagal melompat ke halaman:", err);
        }
      }
    };

    function renderPage(num, animClass = '') {
      pageRendering = true;
      loading.style.display = 'block';

      pdfDoc.getPage(num).then(page => {
        const availableW = container.clientWidth - 8;
        const availableH = container.clientHeight - 8;
        const unscaledViewport = page.getViewport({ scale: 1.0 });

        const scaleW = availableW / unscaledViewport.width;
        const scaleH = availableH / unscaledViewport.height;
        const scale = Math.min(scaleW, scaleH);

        const dpr = Math.min(window.devicePixelRatio || 1.5, 2.0);
        const viewport = page.getViewport({ scale: scale * dpr });
        const displayViewport = page.getViewport({ scale: scale });

        canvas.height = viewport.height;
        canvas.width = viewport.width;
        canvas.style.width = `${displayViewport.width}px`;
        canvas.style.height = `${displayViewport.height}px`;

        pageWrapper.style.width = `${displayViewport.width}px`;
        pageWrapper.style.height = `${displayViewport.height}px`;

        const renderContext = { canvasContext: ctx, viewport: viewport };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(() => {
          pageRendering = false;
          loading.style.display = 'none';

          if (animClass) {
            pageWrapper.classList.remove('swipe-next', 'swipe-prev');
            void pageWrapper.offsetWidth;
            pageWrapper.classList.add(animClass);
          }

          pageFloatingText.textContent = `${num} / ${pdfDoc.numPages}`;

          // Render Lapisan Tautan Daftar Isi
          annotationContainer.innerHTML = '';
          page.getAnnotations().then(annotations => {
            pdfjsLib.AnnotationLayer.render({
              viewport: displayViewport.clone({ dontFlip: true }),
              div: annotationContainer,
              annotations: annotations,
              page: page,
              linkService: linkService
            });
          });

          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      }).catch(err => {
        pageRendering = false;
        loading.style.display = 'none';
        console.error(err);
      });
    }

    function queueRenderPage(num, animClass = '') {
      if (pageRendering) pageNumPending = num;
      else renderPage(num, animClass);
    }

    function nextPage() {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum, 'swipe-next');
    }

    function prevPage() {
      if (!pdfDoc || pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum, 'swipe-prev');
    }

    // Gestur Usap (Swipe) & Ketuk 2x (Double Tap)
    let touchStartX = 0;
    let touchStartY = 0;
    let lastTapTime = 0;

    container.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });

    container.addEventListener('touchend', (e) => {
      // Jika pengguna menyentuh link daftar isi, biarkan link yang bekerja
      if (e.target.closest('.linkAnnotation')) return;

      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchStartX - touchEndX;
      const diffY = touchStartY - touchEndY;

      if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 0) nextPage();
        else prevPage();
        return;
      }

      const currentTime = new Date().getTime();
      const tapInterval = currentTime - lastTapTime;

      if (tapInterval < 300 && tapInterval > 0) {
        mainHeader.classList.toggle('show');
        lastTapTime = 0;
      } else {
        lastTapTime = currentTime;
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
      if (e.key === 'Escape') mainHeader.classList.toggle('show');
    });

    function loadPDFSource(sourceData) {
      loading.style.display = 'block';
      loading.textContent = 'Membuka dokumen...';

      pdfjsLib.getDocument(sourceData).promise.then(doc => {
        pdfDoc = doc;
        pageNum = 1;
        renderPage(pageNum);
      }).catch(err => {
        loading.textContent = 'Gagal memuat: ' + err.message;
      });
    }

    document.getElementById('book-select').addEventListener('change', (e) => {
      loadPDFSource(e.target.value);
      mainHeader.classList.remove('show');
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fileReader = new FileReader();
      fileReader.onload = function() {
        loadPDFSource({ data: new Uint8Array(this.result) });
        mainHeader.classList.remove('show');
      };
      fileReader.readAsArrayBuffer(file);
    });

    window.addEventListener('resize', () => {
      if (pdfDoc) queueRenderPage(pageNum);
    });

    loadPDFSource(document.getElementById('book-select').value);
  </script>
</body>
</html>
